<!-- ヘッダー -->
<header class="site-header">
    <button id="menu-button" type="button"
        aria-label="目次を開く" aria-expanded="false">≡</button>
    <h1 id="page-title">キャラクター一覧</h1>
</header>

<!-- 目次 -->
<div id="menu-overlay"></div>
<nav id="side-menu" aria-label="目次">
    <h2>目次</h2>
    <button class="nav-link" data-page="home">ホーム</button>
    <button class="nav-link" data-page="star5">★5 キャラクター</button>
    <button class="nav-link" data-page="star4">★4 キャラクター</button>

    <h3>国・地域別</h3>
    <div id="region-menu"></div>
</nav>

<!-- ページの内容 -->
<main id="page-content">
    <div class="gallery" id="gallery"></div>
</main>

<!-- 大きなキャラ画像表示 -->
<div class="image-modal" id="imageModal">
    <button class="close-button" onclick="closeCharacterImage()">×</button>
    <img id="largeCharacterImage" src="" alt="キャラクター画像">
</div>

<!-- ★5ガチャ演出画像表示 -->
<div class="image-modal" id="gachaModal">
    <button class="close-button" onclick="closeGachaImage()">×</button>
