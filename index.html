<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鳴潮 キャラクター一覧</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- パスワード入力画面 -->
<div id="password-screen">
    <div class="password-box">
        <h2>キャラクター一覧 ver.193</h2>
        <p>閲覧するにはパスワードを入力してください。</p>

        <form id="password-form">
            <input
                type="password"
                id="password-input"
                placeholder="パスワード"
                required
            >
            <button type="submit">入室</button>
        </form>

        <p id="password-error"></p>
    </div>
</div>

<h1>キャラクター一覧</h1>

<div class="gallery" id="gallery"></div>

<!-- 大きなキャラ画像表示 -->
<div class="image-modal" id="imageModal">
    <button class="close-button" onclick="closeCharacterImage()">×</button>
    <img id="largeCharacterImage" src="" alt="キャラクター画像">
</div>

<!-- ★5ガチャ演出画像表示 -->
<div class="image-modal" id="gachaModal">
    <button class="close-button" onclick="closeGachaImage()">×</button>
    <img src="画像/gacha.jpeg" alt="★5ガチャ演出">
</div>

<script src="characters.js"></script>

</body>
</html>
